# The Rust release everything is built and checked with. Keep it equal to
# packaging/RUST_VERSION, which the distro packages build with: distro cargo is too old on
# Debian 12 (1.63) and Ubuntu 22.04 (1.75), and the code needs 1.85 or newer.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
