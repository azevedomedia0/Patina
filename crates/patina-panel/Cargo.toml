[package]
name = "patina-panel"
description = "Patina top panel (layer-shell client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
patina-tokens = { path = "../patina-tokens" }
patina-sysinfo = { path = "../patina-sysinfo" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "svg", "wayland"] }
iced_layershell = "0.19.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[lints]
workspace = true
