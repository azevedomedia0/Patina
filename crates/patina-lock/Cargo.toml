[package]
name = "patina-lock"
description = "Patina lock screen (ext-session-lock client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
patina-tokens = { path = "../patina-tokens" }
patina-ui = { path = "../patina-ui" }
patina-signin = { path = "../patina-signin" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "svg", "image-without-codecs", "wayland"] }
iced_sessionlock = "0.19.1"
tokio = { version = "1", default-features = false, features = ["time", "sync", "rt"] }

[lints]
workspace = true
