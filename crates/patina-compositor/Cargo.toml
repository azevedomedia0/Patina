[package]
name = "patina-compositor"
description = "Patina Wayland compositor (Smithay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
patina-tokens = { path = "../patina-tokens" }
patina-frame = { path = "../patina-frame" }
tiny-skia = "0.11"
xcursor = "0.3"
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
